<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">The Pass app icon</title>
  <desc id="desc">A warm dark kitchen order ticket with The Pass wordmark and orange service bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d16"/>
      <stop offset="1" stop-color="#120f0c"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2732c"/>
      <stop offset="1" stop-color="#c83d12"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <path d="M110 206H914M110 818H914" stroke="#f2ebdd" stroke-opacity=".13" stroke-width="4"/>
  <rect x="158" y="155" width="708" height="714" rx="26" fill="#1b1712" stroke="#f2ebdd" stroke-opacity=".12" stroke-width="5" filter="url(#shadow)"/>
  <path d="M205 231H819" stroke="#f2ebdd" stroke-opacity=".12" stroke-width="4" stroke-dasharray="16 18"/>
  <text x="205" y="321" fill="#f3b562" font-family="monospace" font-size="30" letter-spacing="11">ORDER TICKET</text>
  <text x="205" y="514" fill="#f2ebdd" font-family="Arial Black, Arial, sans-serif" font-size="151" font-weight="900" letter-spacing="-8">THE</text>
  <text x="205" y="671" fill="#e8541e" font-family="Arial Black, Arial, sans-serif" font-size="174" font-weight="900" letter-spacing="-10">PASS</text>
  <rect x="205" y="731" width="614" height="67" rx="8" fill="url(#fire)"/>
  <text x="512" y="775" text-anchor="middle" fill="#17130f" font-family="monospace" font-size="25" font-weight="700" letter-spacing="8">FIRE THE KITCHEN</text>
</svg>
