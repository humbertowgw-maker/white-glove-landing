<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">PoopSense app icon</title>
  <desc id="desc">A clinical dark card with a paw print icon, POOPSENSE wordmark, and rose-pink AI vet report badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1018"/>
      <stop offset="1" stop-color="#100a0d"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow-rose" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="226" fill="url(#bg)"/>

  <!-- Ambient glow top -->
  <ellipse cx="512" cy="210" rx="340" ry="160" fill="#fb7185" fill-opacity=".1"/>

  <!-- Card panel -->
  <rect x="130" y="128" width="764" height="768" rx="28" fill="#180e13" stroke="#fb7185" stroke-opacity=".18" stroke-width="4" filter="url(#shadow)"/>

  <!-- Header bar -->
  <rect x="130" y="128" width="764" height="76" rx="28" fill="url(#rose)"/>
  <rect x="130" y="172" width="764" height="32" fill="url(#rose)"/>

  <!-- Header label -->
  <text x="512" y="180" text-anchor="middle" fill="#100a0d" font-family="monospace" font-size="27" font-weight="700" letter-spacing="10">VET REPORT</text>

  <!-- Divider -->
  <line x1="170" y1="238" x2="854" y2="238" stroke="#fb7185" stroke-opacity=".2" stroke-width="2"/>

  <!-- Paw print — center palm pad -->
  <ellipse cx="512" cy="380" rx="72" ry="60" fill="url(#rose)" filter="url(#glow-rose)" opacity=".9"/>

  <!-- Paw print — four toe pads -->
  <ellipse cx="412" cy="298" rx="36" ry="30" fill="url(#rose)" opacity=".88"/>
  <ellipse cx="476" cy="262" rx="38" ry="32" fill="url(#rose)" opacity=".92"/>
  <ellipse cx="548" cy="262" rx="38" ry="32" fill="url(#rose)" opacity=".92"/>
  <ellipse cx="614" cy="298" rx="36" ry="30" fill="url(#rose)" opacity=".88"/>

  <!-- Wordmark -->
  <text x="512" y="522" text-anchor="middle" fill="#fb7185" font-family="Arial Black, Arial, sans-serif" font-size="136" font-weight="900" letter-spacing="-6">POOP</text>
  <text x="512" y="650" text-anchor="middle" fill="#f5f0f2" font-family="Arial Black, Arial, sans-serif" font-size="136" font-weight="900" letter-spacing="-6">SENSE</text>

  <!-- AI badge -->
  <rect x="326" y="680" width="372" height="56" rx="10" fill="url(#rose)" opacity=".92"/>
  <text x="512" y="716" text-anchor="middle" fill="#100a0d" font-family="monospace" font-size="24" font-weight="700" letter-spacing="8">AI ANALYSIS</text>

  <!-- Clinical report lines -->
  <line x1="170" y1="764" x2="854" y2="764" stroke="#fb7185" stroke-opacity=".15" stroke-width="1.5"/>
  <text x="170" y="798" fill="#fb7185" font-family="monospace" font-size="22" font-weight="500" opacity=".42">CONSISTENCY  ●●●●○</text>
  <text x="170" y="836" fill="#fb7185" font-family="monospace" font-size="22" font-weight="500" opacity=".42">URGENCY      ●●○○○</text>
  <text x="170" y="874" fill="#fb7185" font-family="monospace" font-size="20" opacity=".25" letter-spacing="2">CLAUDE VISION API · FLASK · RAILWAY</text>
</svg>
